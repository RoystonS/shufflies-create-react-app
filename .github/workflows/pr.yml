name: Pull Request CI
on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - name: Install latest npm
        run: npm i -g npm@12
      - name: Detailed node+npm versions
        run: |
          node -v
          npm -v
      - name: Install dependencies
        run: npm clean-install
      - name: Build package
        run: npm run build
      - name: Check types
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      # Scaffolding installs the template's dependencies, so every supported Node
      # version proves it can do that and pass the app's checks. The browser tests run
      # on one version only, because each of them would download a browser of its own.
      - name: Scaffold a sample app and verify it
        env:
          CHECK_SCREENSHOTS: ${{ matrix.node-version == '26.x' && '1' || '' }}
        run: npm run test:scaffold

  # Collect the above matrix together into a single check that PRs can be blocked on
  ci-success:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    steps:
      - name: Check build and test results
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "Build and test failed"
            exit 1
          fi
          echo "All checks passed"
