name: Build + publish package to npmjs
on:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed for OIDC for npm publication
      id-token: write
      # Needed for semantic release to update issues
      issues: write
      # Needed for semantic release to create tags + releases
      contents: write
      # Needed for semantic release to update PRs
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - name: Install latest npm
        run: npm i -g npm@12
      - name: Detailed node+npm versions
        run: |
          node -v
          npm -v
      - name: Install dependencies
        run: npm clean-install
      - name: Build package
        run: npm run build
      - name: Check types
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Scaffold a sample app and verify it
        env:
          # Also run the generated app's Playwright tests, which download a browser.
          CHECK_SCREENSHOTS: "1"
        run: npm run test:scaffold
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --debug
